name: Build and cache

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner_target:
        description: Select runner target
        required: true
        default: self-hosted
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
      update_lock:
        description: Update flake.lock before build
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target ||
      'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      lock-updated: ${{ steps.targets.outputs.lock-updated }}

    steps:
      - uses: actions/checkout@v6

      - uses: wimpysworld/nothing-but-nix@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          hatchet-protocol: 'carve'
          witness-carnage: 'true'
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            extra-substituters = https://nix.mcseekeri.com?priority=51
            extra-trusted-public-keys = nix.mcseekeri.com-1:3gd0/2u7IOF7YooxEiBbWTvRCYGC53S2UoqFdnCUYHc=
            build-dir = /nix/build

      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.mcseekeri.com
          drain-timeout: 3600

      - name: Update flake lock
        if: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.update_lock }}
        run: nix flake update

      - name: Validate formatting and static checks
        run: >-
          nix build .#checks.x86_64-linux.treefmt --no-link --debug
          --log-format raw --print-build-logs --show-trace --option log-lines 0

      - name: Upload updated flake lock
        if: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.update_lock }}
        uses: actions/upload-artifact@v4
        with:
          name: updated-flake-lock
          path: flake.lock
          if-no-files-found: error

      - name: Generate build matrix
        id: targets
        shell: bash
        env:
          UPDATE_LOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.update_lock || false }}
        run: |
          set -euo pipefail

          packages_json=$(nix eval --json .#packages.x86_64-linux \
            --apply builtins.attrNames)
          hosts_json=$(nix eval --json .#nixosConfigurations \
            --apply builtins.attrNames)
          matrix=$(jq -cn \
            --argjson packages "${packages_json}" \
            --argjson hosts "${hosts_json}" \
            '{include:
              (($packages | map({name: ("package-" + .),
                target: (".#packages.x86_64-linux." + .)}))
              + ($hosts | map({name: ("system-" + .),
                target: (".#nixosConfigurations." + .
                  + ".config.system.build.toplevel")}))
              + [{name: "iso-cuba",
                target: ".#nixosConfigurations.cuba.config.system.build.isoImage"}])}')

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "lock-updated=${UPDATE_LOCK}" >> "${GITHUB_OUTPUT}"
          echo "Build matrix: ${matrix}"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.runner_target ||
      'ubuntu-latest' }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: wimpysworld/nothing-but-nix@main
        if: ${{ runner.environment != 'self-hosted' }}
        with:
          hatchet-protocol: 'carve'
          witness-carnage: 'true'
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes
            extra-substituters = https://nix.mcseekeri.com?priority=51
            extra-trusted-public-keys = nix.mcseekeri.com-1:3gd0/2u7IOF7YooxEiBbWTvRCYGC53S2UoqFdnCUYHc=
            build-dir = /nix/build

      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.mcseekeri.com
          drain-timeout: 3600

      - name: Download updated flake lock
        if: needs.validate.outputs.lock-updated == 'true'
        uses: actions/download-artifact@v4
        with:
          name: updated-flake-lock
          path: .ci/updated-flake-lock

      - name: Apply updated flake lock
        if: needs.validate.outputs.lock-updated == 'true'
        run: cp .ci/updated-flake-lock/flake.lock flake.lock

      - name: Build target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "Building ${TARGET}"
          nix build --no-link --debug --log-format raw --print-build-logs \
            --show-trace --option log-lines 0 --max-jobs auto \
            "${TARGET}"
