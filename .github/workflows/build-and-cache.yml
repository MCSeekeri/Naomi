name: 构建与缓存
run-name: ${{ inputs.update_lock && '预热缓存' || '构建缓存' }} · ${{ github.ref_name }}
# yamllint disable rule:line-length

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_lock:
        description: 更新锁文件后预热缓存
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.update_lock && 'warm' || 'locked' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  NIKS3_SERVER_URL: https://niks3.mcseekeri.com
  NIX_EXTRA_CONFIG: |
    accept-flake-config = true
    experimental-features = nix-command flakes
    builders =
    narinfo-cache-negative-ttl = 0
    build-dir = /nix/build

jobs:
  prepare:
    name: 准备构建
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      lock-file: ${{ steps.targets.outputs.lock-file }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备构建空间
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'carve'
          witness-carnage: 'true'

      - name: 安装 Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ env.NIX_EXTRA_CONFIG }}

      - name: 配置二进制缓存
        uses: Mic92/niks3-action@v1
        with:
          server-url: ${{ env.NIKS3_SERVER_URL }}
          drain-timeout: 600

      - name: 更新锁文件
        if: inputs.update_lock
        run: nix flake update

      - name: 检查格式与静态规则
        run: nix build .#checks.x86_64-linux.treefmt --no-link --option log-lines 50

      - name: 生成构建矩阵
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          packages=$(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames)
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)
          matrix=$(jq -cn --argjson packages "$packages" --argjson hosts "$hosts" '
            {include:
              (($packages | map({name: ("package-" + .), target: (".#packages.x86_64-linux." + .)}))
              + ($hosts | map({name: ("system-" + .), target: (".#nixosConfigurations." + . + ".config.system.build.toplevel")})))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "lock-file=$(base64 -w0 flake.lock)" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 恢复本轮锁文件
        shell: bash
        env:
          LOCK_FILE: ${{ needs.prepare.outputs.lock-file }}
        run: printf '%s' "$LOCK_FILE" | base64 --decode > flake.lock

      - name: 准备构建空间
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'carve'
          witness-carnage: 'true'

      - name: 安装 Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ env.NIX_EXTRA_CONFIG }}

      - name: 配置二进制缓存
        uses: Mic92/niks3-action@v1
        id: cache
        with:
          server-url: ${{ env.NIKS3_SERVER_URL }}
          drain-timeout: 600

      - name: 构建目标
        timeout-minutes: 260
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          nix build --keep-going --print-build-logs --log-format raw \
            --out-link "${RUNNER_TEMP}/naomi-result" --option log-lines 50 \
            --max-jobs auto "$TARGET"

      - name: 上传完整闭包
        timeout-minutes: 45
        shell: bash
        env:
          NIKS3_BIN_DIR: ${{ steps.cache.outputs.binary-dir }}
          NIKS3_AUTH_TOKEN_SCRIPT: ${{ steps.cache.outputs.auth-token-script }}
        run: |
          "${NIKS3_BIN_DIR}/niks3" push \
            --server-url "$NIKS3_SERVER_URL" \
            --auth-token-script "${NIKS3_AUTH_TOKEN_SCRIPT:?}" \
            --retry-timeout 15m "${RUNNER_TEMP}/naomi-result"
